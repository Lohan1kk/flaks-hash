{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<h2>Login</h2>
<p>O banco guarda só o hash SHA-256 da senha. No login o sistema compara os hashes.</p>

<form method="post">
  <p>
    <label>Usuário<br>
      <input type="text" name="usuario" required value="{{ request.form.usuario or '' }}">
    </label>
  </p>
  <p>
    <label>Senha<br>
      <input type="password" name="senha" required>
    </label>
  </p>
  <p><button type="submit">Entrar</button></p>
</form>

<hr>
<p><strong>Usuário de teste:</strong> aluno_exemplo</p>
<p><strong>Senha de teste:</strong> Aula@1234</p>
{% endblock %}
